Description: Downloads the latest version of Gitfox.
Identifier: com.github.homebysix.download.Gitfox
Input:
  NAME: Gitfox
MinimumVersion: '2.3'
Process:
  - Processor: URLDownloader
    Arguments:
      filename: '%NAME%.dmg'
      url: https://update.gitfox.app/Gitfox.latest.stable.dmg
  - Processor: EndOfCheckPhase
  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/Gitfox.app'
      requirement: anchor apple generic and identifier "com.bytieful.Gitfox-retail" and (certificate
        leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6]
        /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists
        */ and certificate leaf[subject.OU] = MCZZULX74P)
  - Processor: Versioner
    Arguments:
      input_plist_path: '%pathname%/Gitfox.app/Contents/Info.plist'
      plist_version_key: CFBundleShortVersionString
